<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo — jogo sério de Scrum</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1b2430;
            color: #c7d1e2;
            font-family: monospace;
            height: 100%;
        }

        main {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            box-sizing: border-box;
        }

        #jogo canvas {
            display: block;
            border: 2px solid #2b3348;
        }

        p {
            margin: 0;
            font-size: 12px;
            color: #7d8ba3;
        }
    </style>
</head>
<body>
    <main>
        <div id="jogo"></div>
        <p>incremento 1: escritório navegável e interação com NPCs</p>
    </main>

    <script src="vendor/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>

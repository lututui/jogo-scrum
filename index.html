<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Protótipo — jogo sério de Scrum</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1b2430;
            color: #c7d1e2;
            font-family: monospace;
            overflow: hidden;
        }

        /* O jogo ocupa a janela inteira.
           O Phaser mede este elemento para decidir a escala. */
        #jogo {
            position: fixed;
            inset: 0;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
        }

        #jogo canvas {
            display: block;
        }
    </style>
</head>
<body>
<div id="jogo"></div>

    <script src="vendor/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
